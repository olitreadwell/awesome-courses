# Configuration for this awesome list. Everything the engine needs
# beyond README.md lives here.

name = "Awesome Courses"
repo_slug = "awesome-courses"
readme = "README.md"
badge = "default"

sections = [
    "Courses",
]

[site]
# The template has no site generator yet, so this stays off.
enabled = false

[structure]
# Every course hangs its lecture videos, notes, assignments and old exams under
# the course entry they belong to.
nested_details = true

